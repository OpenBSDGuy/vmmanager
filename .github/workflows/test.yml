name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]  # oldest supported (pyproject) and newest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m py_compile vmmanager/*.py vmmanager/ui/*.py
      - run: python -m unittest discover -s tests -v
      - if: hashFiles('vmmanager/man/vmmanager.8') != ''
        run: sudo apt-get install -y mandoc && mandoc -Tlint -Wwarning vmmanager/man/*
